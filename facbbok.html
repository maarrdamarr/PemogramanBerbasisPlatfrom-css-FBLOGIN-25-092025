<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login ke Facebook — Tiruan Sederhana</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>    
        <h1 class="title">
            Nama : Damar Ninuwidarma
            Nim : 24051204220
            Kelas : 2024 G
        </h1>
    </div>

    <main class="page">
      <h1 class="brand" aria-label="facebook">facebook</h1>

      <section class="card" role="form" aria-labelledby="card-title">
        <h2 id="card-title" class="card-title">Login ke Facebook</h2>

        <form class="form" autocomplete="off">
          <div class="form-group">
            <label for="email" class="sr-only">Email atau Nomor Telepon</label>
            <input id="email" type="text" placeholder="Email atau Nomor Telepon" />
          </div>

          <div class="form-group">
            <label for="password" class="sr-only">Kata Sandi</label>
            <input id="password" type="password" placeholder="Kata Sandi" />
          </div>

          <button type="button" class="btn btn-primary">Masuk</button>

          <p class="forgot"><a href="#">Lupa akun?</a></p>

          <div class="divider" role="separator">
            <span>atau</span>
          </div>

          <button type="button" class="btn btn-success">Buat akun baru</button>
        </form>
      </section>
    </main>
  </body>
</html>
